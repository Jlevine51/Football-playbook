<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f4f8;color:#1a1a1a}
header{background:#1a3a5c;color:#fff;padding:14px 16px}
header h1{font-size:17px;font-weight:700}
header p{font-size:12px;opacity:.8;margin-top:2px}
.container{max-width:600px;margin:0 auto;padding:16px}
.score-bar{background:#e8edf5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#1a3a5c;font-weight:500}
.play-counter{font-size:12px;color:#888;margin-bottom:8px;text-align:center}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #dde3ea}
.play-label{font-size:12px;font-weight:600;color:#1a3a5c;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.hint{font-size:10px;color:#888;margin-bottom:10px;font-style:italic}
.signals{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.sig-item{flex:0 0 95px;text-align:center}
.sig-item img{width:95px;height:115px;object-fit:cover;object-position:top;border-radius:8px;border:2.5px solid #dde3ea;display:block;cursor:pointer;transition:opacity .15s}
.sig-item img:hover{opacity:.85}
.sig-item img.correct{border-color:#2d7a2d}
.sig-item img.wrong{border-color:#cc2222}
.step-label{font-size:9px;color:#999;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
select{width:100%;margin-top:4px;padding:5px 4px;border-radius:6px;border:1px solid #ccc;font-size:11px;background:#fff}
select.correct{border-color:#2d7a2d;background:#f0faf0;color:#2d7a2d;font-weight:600}
select.wrong{border-color:#cc2222;background:#fff5f5;color:#cc2222}
.feedback{font-size:10px;margin-top:2px;min-height:13px}
.feedback.c{color:#2d7a2d}.feedback.w{color:#cc2222}
.btn{display:block;width:100%;padding:13px;border-radius:8px;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.btn-check{background:#1a3a5c;color:#fff}
.btn-next{background:#2d7a2d;color:#fff;display:none}

/* Lightbox */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;align-items:center;justify-content:center;cursor:pointer}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:10px;object-fit:contain}
.lightbox-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;opacity:.7}
</style>
</head>
<body>
<header>
  <h1>📋 Signal Quiz</h1>
  <p>Identify each signal — select from the dropdown</p>
</header>

<!-- Lightbox overlay -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="Signal enlarged">
  <div class="lightbox-hint">Tap / click anywhere to close</div>
</div>

<div class="container">
  <div class="score-bar" id="score-bar">Score: 0 / 0 plays completed</div>
  <div class="play-counter" id="play-counter">Play 1</div>
  <div class="card" id="quiz-card"></div>
  <button class="btn btn-check" id="btn-check" onclick="checkAnswers()">Check Answers</button>
  <button class="btn btn-next" id="btn-next" onclick="nextPlay()">Next Random Play ▶</button>
</div>

let correct=0,total=0,cur=null;

function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

function rand(){return plays[Math.floor(Math.random()*plays.length)];}

function load(play){
  cur=play;
  document.getElementById('play-counter').textContent='Play '+(total+1);
  let h='<div class="play-label">What is this play call?</div>';
  h+='<div class="hint">Tap or click any photo to enlarge it</div>';
  h+='<div class="signals">';
  play.steps.forEach((s,i)=>{
    h+=`<div class="sig-item">
      <img src="data:image/jpeg;base64,${s.img}" id="img-${i}"
           onclick="openLightbox(this.src)" title="Click to enlarge">
      <div class="step-label">${s.cat}</div>
      <select id="sel-${i}">${s.options.map(o=>`<option>${o}</option>`).join('')}</select>
      <div class="feedback" id="fb-${i}"></div>
    </div>`;
  });
  h+='</div>';
  document.getElementById('quiz-card').innerHTML=h;
  document.getElementById('btn-check').style.display='block';
  document.getElementById('btn-next').style.display='none';
}

function checkAnswers(){
  let ok=true;
  cur.steps.forEach((s,i)=>{
    const sel=document.getElementById('sel-'+i);
    const fb=document.getElementById('fb-'+i);
    const im=document.getElementById('img-'+i);
    if(sel.value===s.correct){
      sel.className='correct';im.className='correct';
      fb.className='feedback c';fb.textContent='✓';
    }else{
      sel.className='wrong';im.className='wrong';
      fb.className='feedback w';fb.textContent='✗ '+s.correct;
      ok=false;
    }
  });
  total++;if(ok)correct++;
  document.getElementById('score-bar').textContent='Score: '+correct+' / '+total+' plays correct';
  document.getElementById('btn-check').style.display='none';
  document.getElementById('btn-next').style.display='block';
}

function nextPlay(){load(rand());}
load(rand());
</script>
